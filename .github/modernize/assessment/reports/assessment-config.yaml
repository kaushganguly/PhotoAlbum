analysisCoverage: full
security:
  minimumCveSeverity: medium
java:
  assessmentDomains:
    - java-upgrade
    - cloud-readiness
  targetRuntime: openjdk25
  targetComputeServices:
    - azure-appservice
    - azure-aks
    - azure-container-apps
  targetOS:
    - windows
    - linux
  enableContainerization: false
dotnet:
  assessmentDomains:
    - dotnet-upgrade
    - cloud-readiness
  targetRuntime: net10.0
  targetComputeServices:
    - Any
